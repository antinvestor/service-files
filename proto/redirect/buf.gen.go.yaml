# Go code for apps/redirect (committed under apps/redirect/gen).
# Regenerate: cd proto/redirect && buf generate --template buf.gen.go.yaml
version: v2
managed:
  enabled: true
  disable:
    - module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: github.com/antinvestor/service-files/apps/redirect/gen
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: ../../apps/redirect/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v2.0.0
    out: ../../apps/redirect/gen
    opt: paths=source_relative
