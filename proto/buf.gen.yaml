# Regenerate the files SDK and OpenAPI: cd proto && buf generate --path files
# (apps/redirect has its own Go template: proto/redirect/buf.gen.go.yaml).
version: v2
managed:
  enabled: true

plugins:
  # OpenAPI spec generation
  - remote: buf.build/community/sudorandom-connect-openapi
    out: ../apps/default
    opt:
      - features=connectrpc;gnostic;protovalidate
      - content-types=json
      - allow-get

  # Dart protobuf generation. Pinned together with connectrpc/dart: protoc_plugin
  # 25 imports well-known types from package:protobuf, so delete the WKT copies
  # that include_wkt re-emits under lib/src/google/protobuf (keep descriptor.*,
  # which buf/validate and gnostic import).
  - remote: buf.build/protocolbuffers/dart:v25.1.0
    out: ../sdk/dart/files/lib/src
    include_imports: true
    include_wkt: true

  # Dart ConnectRPC generation
  - remote: buf.build/connectrpc/dart:v2.0.0
    out: ../sdk/dart/files/lib/src
    include_imports: true
    include_wkt: true
